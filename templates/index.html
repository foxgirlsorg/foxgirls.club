<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Girls Club</title>
    <link rel="stylesheet" href="/static/css/index.css">
    <link rel="stylesheet" href="/static/css/menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta property="og:title" content="Fox Girls Club" />
    <meta name="twitter:description" content="Fox girls are just better :3">
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Fox girls are just better :3">
    <meta property="og:url" content="https://foxgirls.club/" />
    <meta property="og:image" content="https://foxgirls.club/static/images/banner.jpg" />
    <meta name="twitter:image" content="https://foxgirls.club/static/images/banner.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fox Girls Club">

</head>

<body>

    <div class="backdrop" aria-hidden="true">
        <img id="bgimage" src="{{img_url}}" alt="">
        <div class="noise"></div>
    </div>

    <div class="navbar">
        <div class="left">
            <img src="/favicon.ico" alt="">
            <a href="/">
                <h1>FOXGIRLS.<span class="accent">CLUB</span></h1>
            </a>
        </div>
        <div class="right">
            <input id="menu-toggle" type="checkbox" />
            <label class='menu-button-container' for="menu-toggle">
                <div class='menu-button'></div>
            </label>
            <ul class="menu">
                <li><a class="navmenuitem" href="/{{r_link}}" title="{{r_link}} images">{{r_link}}</a></li>
                <li><a class="navmenuitem" href="/api/endpoints" target="_blank" title="API">API</a></li>
                <li><a class="navmenuitem" href="#" onclick="alert('soon')" title="Telegram bot"><i
                            class="fab fa-telegram-plane"></i></a></li>
            </ul>
        </div>
    </div>

    <div class="container">
        <div class="eyebrow-row">
            <span class="divider-line"></span>
            <span class="badge">{{rating}}</span>
            <span class="divider-line"></span>
        </div>

        <div class="image is-loading" id="image-frame">
            <div class="image-spinner" id="image-spinner" aria-hidden="true"></div>
            <img id="image" src="{{img_url}}" alt="Random {{rating}} fox girl illustration">
        </div>

        <div class="btns">
            <a href="{{img_url}}" download class="pill-btn download" id="download"><i class="fas fa-download"></i>
                Download</a>

            <button type="button" class="pill-btn reload" onclick="updateImage();">
                <i class="fas fa-sync-alt" id="reload-icon"></i>
                <span>Reload</span>
            </button>
        </div>
    </div>

    <footer>
    <span>&copy; <span id="current-year"></span> Made by <a href="https://foxgirls.org" target="_blank">foxgirls.org</a></span>
    </footer>

    <script>
        const PLACEHOLDER_URL = "/static/images/placeholder.svg";

        function setSpinning(on) {
            document.getElementById("reload-icon").classList.toggle("is-spinning", on);
        }

        function setImageLoading(on) {
            document.getElementById("image-frame").classList.toggle("is-loading", on);
        }

        function handleImageError() {
            var elem = document.getElementById("image");
            if (elem.dataset.fallback === "1") {
                setImageLoading(false);
                return;
            }
            elem.dataset.fallback = "1";
            elem.src = PLACEHOLDER_URL;
            document.getElementById("image-frame").classList.add("is-placeholder");
            document.getElementById("download").classList.add("is-disabled");
            setSpinning(false);
        }

        async function updateImage() {
            var link = ("{{r_link}}" == "nsfw") ? "/api/sfw" : "/api/nsfw";
            setSpinning(true);
            setImageLoading(true);
            try {
                const response = await fetch(link);
                if (!response.ok) {
                    throw new Error("Request failed");
                }
                const data = await response.json();
                var elem = document.getElementById("image");
                var elem2 = document.getElementById("download");
                var elem3 = document.getElementById("bgimage");
                elem.dataset.fallback = "0";
                document.getElementById("image-frame").classList.remove("is-placeholder");
                elem2.classList.remove("is-disabled");
                elem.src = data['url'];
                elem2.href = data['url'];
                elem3.src = data['url'];
            } catch (err) {
                handleImageError();
            }
        }

        var mainImage = document.getElementById("image");
        mainImage.addEventListener("load", () => {
            setSpinning(false);
            setImageLoading(false);
        })
        mainImage.addEventListener("error", handleImageError);
        if (mainImage.complete) {
            if (mainImage.naturalWidth === 0) {
                handleImageError();
            } else {
                setImageLoading(false);
            }
        }

        document.getElementById("bgimage").addEventListener("error", function () {
            this.style.opacity = 0;
        });
        document.querySelectorAll(".menu a.navmenuitem").forEach((link) => {
            link.addEventListener("click", () => {
                document.getElementById("menu-toggle").checked = false;
            });
        });

        document.getElementById("current-year").textContent = new Date().getFullYear();
    </script>
</body>

</html>
